<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title id="page-title">Loading... | Tad.atelier</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bitter:wght@300&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fancyapps/ui/dist/fancybox.css" />
    <link href="/assets/css/styles.css" rel="stylesheet">
    <link href="/assets/css/project.css" rel="stylesheet">
    <style>
        .fancybox__backdrop { background: var(--fancybox-bg, rgba(24, 24, 27, .98)); }
        
        /* CHỐNG MÉO ẢNH VÀ CỐ ĐỊNH KHUNG HÌNH */
        #gallery-container img {
            object-fit: cover; /* Cắt cúp tự động lấp đầy khung, không bao giờ bị bóp méo */
            width: 100%;
            border-radius: 2px;
        }
        
        /* Khống chế tỷ lệ đứng cho khối 2 ảnh chia đôi */
        .img-vertical {
            aspect-ratio: 2/3; 
        }
        
        /* Ép lấp đầy chiều cao cho các ảnh nhỏ trong khối so le */
        .img-horizontal {
            height: 100%; 
        }
    </style>
</head>

<body>
    <div class="navbar navbar-expand navbar-light bg-light d-flex bd-highlight">
        <div class="me-auto">
            <a class="navbar-brand" href="/">Tad.atelier</a>
        </div>
        <div class="p-2">
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link active" href="/projects">Projects</a></li>
                <li class="nav-item"><a class="nav-link" href="/about-us">About Us</a></li>
            </ul>
        </div>
    </div>

    <div class="container-fluid project">
        <div class="row">
            <div class="col-lg-3 description">
                <h1 class="fs-2" id="project-title"></h1>
                <p class="mt-2 mb-0 pb-0" id="project-year"></p>
                <p class="mt-1" id="project-location"></p>
                <div class="mb-1">
                    <p id="project-desc"></p>
                </div>
            </div>
            
            <div class="col-lg-9 photos" id="gallery-container">
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@fancyapps/ui/dist/fancybox.umd.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const projectId = urlParams.get('id');

        fetch('/projects.json')
            .then(res => res.json())
            .then(data => {
                const project = (data.items || []).find(p => p.id === projectId);
                if (project) {
                    // Điền thông tin văn bản
                    document.getElementById('page-title').innerText = project.title + ' | Tad.atelier';
                    document.getElementById('project-title').innerText = project.title;
                    document.getElementById('project-year').innerText = project.year || '';
                    document.getElementById('project-location').innerText = project.location ? `Location: ${project.location}` : '';
                    document.getElementById('project-desc').innerText = project.description || '';

                    // Thuật toán tự động lắp ráp Gallery
                    const container = document.getElementById('gallery-container');
                    const images = project.gallery || [];
                    let htmlContent = '';
                    let i = 0;
                    
                    while (i < images.length) {
                        // Nhịp 1: 1 Ảnh To
                        if (i % 6 === 0) {
                            htmlContent += `
                            <div class="row">
                                <div class="col-md-12 p-1 text-center">
                                    <a data-src="${images[i]}" data-fancybox="gallery">
                                        <img src="${images[i]}" style="width: 1010px;" class="img-fluid">
                                    </a>
                                </div>
                            </div>`;
                            i += 1;
                        }
                        // Nhịp 2: 2 Ảnh Bằng Nhau
                        else if (i % 6 === 1 && i + 1 < images.length) {
                            htmlContent += `
                            <div class="row">
                                <div class="col-md-6 p-1">
                                    <a data-src="${images[i]}" data-fancybox="gallery">
                                        <img src="${images[i]}" class="img-fluid img-vertical float-end">
                                    </a>
                                </div>
                                <div class="col-md-6 p-1">
                                    <a data-src="${images[i+1]}" data-fancybox="gallery">
                                        <img src="${images[i+1]}" class="img-fluid img-vertical float-start">
                                    </a>
                                </div>
                            </div>`;
                            i += 2;
                        }
                        // Nhịp 3: 1 Ảnh To
                        else if (i % 6 === 3) {
                            htmlContent += `
                            <div class="row">
                                <div class="col-md-12 p-1 text-center">
                                    <a data-src="${images[i]}" data-fancybox="gallery">
                                        <img src="${images[i]}" style="width: 1010px;" class="img-fluid">
                                    </a>
                                </div>
                            </div>`;
                            i += 1;
                        }
                        // Nhịp 4: Khối So Le (1 To, 2 Nhỏ)
                        else if (i % 6 === 4 && i + 2 < images.length) {
                            htmlContent += `
                            <div class="row">
                                <div class="col-md-6 p-1">
                                    <a data-src="${images[i]}" data-fancybox="gallery">
                                        <img src="${images[i]}" class="img-fluid float-end">
                                    </a>
                                </div>
                                <div class="col-md-6 p-1 float-start">
                                    <div class="h-50">
                                        <a data-src="${images[i+1]}" data-fancybox="gallery">
                                            <img src="${images[i+1]}" class="img-fluid img-horizontal">
                                        </a>
                                    </div>
                                    <div class="h-50 pt-2">
                                        <a data-src="${images[i+2]}" data-fancybox="gallery">
                                            <img src="${images[i+2]}" class="img-fluid img-horizontal">
                                        </a>
                                    </div>
                                </div>
                            </div>`;
                            i += 3;
                        }
                        // Xử lý ảnh lẻ: Nếu cuối mảng bị dư không đủ bộ, đổ thành 1 Ảnh To
                        else {
                            htmlContent += `
                            <div class="row">
                                <div class="col-md-12 p-1 text-center">
                                    <a data-src="${images[i]}" data-fancybox="gallery">
                                        <img src="${images[i]}" style="width: 1010px;" class="img-fluid">
                                    </a>
                                </div>
                            </div>`;
                            i += 1;
                        }
                    }
                    container.innerHTML = htmlContent;
                } else {
                    document.getElementById('gallery-container').innerHTML = "<p class='text-center mt-5'>Không tìm thấy dự án.</p>";
                }
            });
    </script>
</body>
</html>
