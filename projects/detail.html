<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title id="page-title">Loading... | Tad.atelier</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bitter:wght@300&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fancyapps/ui/dist/fancybox.css" />
    <link href="/assets/css/styles.css" rel="stylesheet">
    <link href="/assets/css/project.css" rel="stylesheet">
    <style>
        .fancybox__backdrop { background: var(--fancybox-bg, rgba(24, 24, 27, .98)); }
    </style>
</head>

<body>
    <div class="navbar navbar-expand navbar-light bg-light d-flex bd-highlight">
        <div class="me-auto">
            <a class="navbar-brand" href="/">Tad.atelier</a>
        </div>
        <div class="p-2">
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link active" href="/projects">Projects</a></li>
                <li class="nav-item"><a class="nav-link" href="/about-us">About Us</a></li>
            </ul>
        </div>
    </div>

    <div class="container-fluid project">
        <div class="row">
            <div class="col-lg-3 description">
                <h1 class="fs-2" id="project-title"></h1>
                <p class="mt-2 mb-0 pb-0" id="project-year"></p>
                <p class="mt-1" id="project-location"></p>
                <div class="mb-1">
                    <p id="project-desc"></p>
                </div>
            </div>
            
            <div class="col-lg-9 photos" id="gallery-container">
                </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@fancyapps/ui/dist/fancybox.umd.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const projectId = urlParams.get('id');

        fetch('/projects.json')
            .then(res => res.json())
            .then(data => {
                const project = (data.items || []).find(p => p.id === projectId);
                if (project) {
                    // Điền thông tin văn bản
                    document.getElementById('page-title').innerText = project.title + ' | Tad.atelier';
                    document.getElementById('project-title').innerText = project.title;
                    document.getElementById('project-year').innerText = project.year || '';
                    document.getElementById('project-location').innerText = project.location ? `Location: ${project.location}` : '';
                    document.getElementById('project-desc').innerText = project.description || '';

                    // Lắp ráp Gallery
                    const container = document.getElementById('gallery-container');
                    let htmlContent = '';
                    
                    if(project.layout_blocks) {
                        project.layout_blocks.forEach(block => {
                            
                            // Render Khối 1 ảnh
                            if(block.type === 'full_width') {
                                htmlContent += `
                                <div class="row">
                                    <div class="col-md-12 p-1 text-center">
                                        <a data-src="${block.image}" data-fancybox="gallery">
                                            <img src="${block.image}" style="width: 1010px;" class="img-fluid">
                                        </a>
                                    </div>
                                </div>`;
                            }
                            
                            // Render Khối 2 ảnh bằng nhau
                            else if (block.type === 'half_width') {
                                htmlContent += `
                                <div class="row">
                                    <div class="col-md-6 p-1">
                                        <a data-src="${block.image_left}" data-fancybox="gallery">
                                            <img src="${block.image_left}" class="img-fluid float-end">
                                        </a>
                                    </div>
                                    <div class="col-md-6 p-1">
                                        <a data-src="${block.image_right}" data-fancybox="gallery">
                                            <img src="${block.image_right}" class="img-fluid float-start">
                                        </a>
                                    </div>
                                </div>`;
                            }

                            // Render Khối So le (1 to, 2 nhỏ)
                            else if (block.type === 'asymmetric') {
                                htmlContent += `
                                <div class="row">
                                    <div class="col-md-6 p-1">
                                        <a data-src="${block.image_main}" data-fancybox="gallery">
                                            <img src="${block.image_main}" class="img-fluid float-end">
                                        </a>
                                    </div>
                                    <div class="col-md-6 p-1 float-start">
                                        <div class="h-50">
                                            <a data-src="${block.image_sub1}" data-fancybox="gallery">
                                                <img src="${block.image_sub1}" class="img-fluid img-horizontal">
                                            </a>
                                        </div>
                                        <div class="h-50 pt-2">
                                            <a data-src="${block.image_sub2}" data-fancybox="gallery">
                                                <img src="${block.image_sub2}" class="img-fluid img-horizontal">
                                            </a>
                                        </div>
                                    </div>
                                </div>`;
                            }
                        });
                    }
                    container.innerHTML = htmlContent;
                }
            });
    </script>
</body>
</html>
