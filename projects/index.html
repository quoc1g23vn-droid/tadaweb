<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Tad.atelier - Projects</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bitter:wght@300&display=swap" rel="stylesheet">
    <link href="/assets/css/styles.css" rel="stylesheet">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-427ELYXSX3"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-427ELYXSX3');
    </script>
    <style>
        .desc {
            z-index: 100;
            display: none;
            width: 100%;
            text-align: center;
        }

        .bg-desc {
            display: none;
            top: 0px;
            position: absolute;
            height: 100%;
            width: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 99;
        }

        a {
            position: relative;
            display: inline-block;
        }

        a:hover>.desc {
            display: block;
        }

        a:hover>.bg-desc {
            display: block;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand navbar-light bg-light d-flex bd-highlight">
        <div class="container">
            <a class="navbar-brand" href="/"><b>Tad.atelier</b></a>
            <div class="p-2">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" href="/projects">Projects</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/about-us">About Us</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container" style="margin-top: 70px;">
        <div class="row gx-1 gy-1 mt-1" id="projects-container">
            </div>
    </div>

    <script>
        fetch('/projects.json')
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('projects-container');
                // Lấy mảng items từ JSON (theo đúng chuẩn cấu hình Decap CMS)
                const projects = data.items || []; 
                
                // Lặp qua từng dự án và tạo mã HTML
                const htmlContent = projects.map(project => `
                    <div class="col-md-4">
                        <a href="/projects/${project.id}">
                            <img src="${project.thumbnail}" class="img-fluid" alt="${project.title}">
                            <span class="bg-desc"></span>
                            <span class="desc overflow-hidden position-absolute top-50 start-50 translate-middle text-white">
                                ${project.title} | ${project.year}
                            </span>
                        </a>
                    </div>
                `).join('');

                container.innerHTML = htmlContent;
            })
            .catch(error => console.error('Lỗi tải danh sách dự án:', error));
    </script>

</body>
</html>
